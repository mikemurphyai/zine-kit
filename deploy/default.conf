server {
    listen 80;
    server_name zine.imurph.com;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;
    sendfile on;
    add_header Cache-Control "private, no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "same-origin" always;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location ~ /\. { deny all; }

    # Video and poster: allow caching so Cloudflare serves repeat views. An add_header
    # here replaces the server-level ones, so the security headers are repeated.
    location /media/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header Cloudflare-CDN-Cache-Control "max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ =404; }
}
