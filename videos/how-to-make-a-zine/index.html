<!doctype html>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f3f0e9;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="93.5"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 6);
        tl.fromTo("#el-02-procedure", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 6);
        tl.addLabel("hf:transition:01-hook:02-procedure:crossfade", 6);
        tl.to("#el-02-procedure", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 12.5);
        tl.fromTo("#el-03-type-pages", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 12.5);
        tl.addLabel("hf:transition:02-procedure:03-type-pages:push-slide", 12.5);
        tl.to("#el-03-type-pages", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 19);
        tl.fromTo("#el-04-sheet-layout", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 19);
        tl.addLabel("hf:transition:03-type-pages:04-sheet-layout:zoom-through", 19);
        tl.to("#el-04-sheet-layout", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 24);
        tl.fromTo("#el-05-print", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 24);
        tl.addLabel("hf:transition:04-sheet-layout:05-print:push-slide", 24);
        tl.to("#el-05-print", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 32);
        tl.fromTo("#el-06-task1-fold-lines", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 32);
        tl.addLabel("hf:transition:05-print:06-task1-fold-lines:push-slide", 32);
        tl.to("#el-06-task1-fold-lines", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 47);
        tl.fromTo("#el-07-task2-cut", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 47);
        tl.addLabel("hf:transition:06-task1-fold-lines:07-task2-cut:push-slide", 47);
        tl.to("#el-07-task2-cut", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 64.5);
        tl.fromTo("#el-08-task3-fold-zine", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 64.5);
        tl.addLabel("hf:transition:07-task2-cut:08-task3-fold-zine:push-slide", 64.5);
        tl.to("#el-08-task3-fold-zine", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 82.5);
        tl.fromTo("#el-09-check", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 82.5);
        tl.addLabel("hf:transition:08-task3-fold-zine:09-check:crossfade", 82.5);
        tl.to("#el-09-check", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 88.5);
        tl.fromTo("#el-10-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 88.5);
        tl.addLabel("hf:transition:09-check:10-cta:crossfade", 88.5);
        tl.to({}, { duration: 93.5 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
